# Longhorn namespace with privileged PodSecurity labels.
# Must apply before the Longhorn chart (-22) so the namespace exists
# with the right labels when pods are created.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-ns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-23"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/meloddik/brakebills-gitops.git
    targetRevision: main
    path: clusters/brakebills/longhorn
    directory:
      include: 'namespace.yaml'

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
