# Longhorn — distributed block storage.
#
# Provides PersistentVolumes backed by NVMe across all nodes.
# Required by Authentik (PostgreSQL) and any stateful workload.
# Sync wave -22: after external-dns (-23), before workloads.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-22"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.11.1
      helm:
        releaseName: longhorn
        skipCrds: false
        valueFiles:
          - $values/clusters/brakebills/longhorn/values.yaml
        # Skip Helm hooks — Longhorn's pre-upgrade hook requires the
        # ServiceAccount from the chart, which hasn't been created yet
        # on initial install. Argo CD manages lifecycle, not Helm hooks.
        parameters:
          - name: preUpgradeChecker.jobEnabled
            value: "false"

    - repoURL: https://github.com/meloddik/brakebills-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
