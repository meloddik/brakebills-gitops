# Authentik — SSO/OIDC identity provider.
#
# Secrets are generated by Terraform in brakebills-talos (random_password
# resources) and deployed as K8s Secrets before Argo CD syncs this app.
# Sync wave -10: after infrastructure apps, before regular workloads.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.2.2
      helm:
        releaseName: authentik
        valueFiles:
          - $values/clusters/brakebills/authentik/values.yaml

    - repoURL: https://github.com/meloddik/brakebills-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
