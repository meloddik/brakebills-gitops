# CronJob that detects and self-heals the argocd-server "stuck empty
# OIDC provider" bug. See clusters/brakebills/argocd/sso-healthcheck.yaml
# for full context.
# Sync wave -19: after argocd (-20), same wave as argocd-ingress.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-sso-healthcheck
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-19"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/meloddik/brakebills-gitops.git
    targetRevision: main
    path: clusters/brakebills/argocd
    directory:
      include: 'sso-healthcheck.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
