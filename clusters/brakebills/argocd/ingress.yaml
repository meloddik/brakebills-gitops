# Ingress for the Argo CD web UI.
#
# cert-manager issues a Let's Encrypt production cert via DNS-01.
# external-dns creates argocd.brakebills.io -> LoadBalancer IP in Cloudflare.
# Cilium ingress controller processes the Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - argocd.brakebills.io
      secretName: argocd-tls
  rules:
    - host: argocd.brakebills.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
