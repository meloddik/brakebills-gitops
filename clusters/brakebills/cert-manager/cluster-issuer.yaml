# Let's Encrypt STAGING issuer using Cloudflare DNS-01.
#
# Staging issues fake certs (not browser-trusted) but has no rate limits,
# so it's safe to iterate on configuration. Switch to production by changing
# the server URL to https://acme-v02.api.letsencrypt.org/directory and
# renaming to letsencrypt-production.
#
# Applied by the certManagerBootstrap Gradle task after cert-manager is running.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: jboddie29@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - brakebills.io
