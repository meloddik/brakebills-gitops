# Let's Encrypt PRODUCTION issuer using Cloudflare DNS-01.
#
# Issues browser-trusted certs. Rate limits apply — see
# https://letsencrypt.org/docs/rate-limits/ (50 certs per domain per week).

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: jboddie29@gmail.com
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - brakebills.io
