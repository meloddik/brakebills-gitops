# Authentik blueprint: Argo CD OIDC provider + application.
#
# Mounted into authentik-worker at /blueprints/custom/ via ConfigMap.
# Worker discovers it on startup and applies via Authentik's declarative API.
#
# Client secret is read from the AUTHENTIK_ARGOCD_CLIENT_SECRET env var
# (set by TF in the authentik-secrets Secret, loaded via envFrom).

apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-argocd
  namespace: authentik
data:
  argocd.yaml: |
    version: 1
    metadata:
      name: argocd-oidc
      labels:
        blueprints.goauthentik.io/description: Argo CD OIDC provider + application
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: argocd
        attrs:
          name: argocd
          client_type: confidential
          client_id: argocd
          client_secret: !Env AUTHENTIK_ARGOCD_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.brakebills.io/auth/callback
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          id: argocd
      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          slug: argocd
          provider: !KeyOf argocd
          meta_launch_url: https://argocd.brakebills.io
