# Authentik blueprint: Vault OIDC provider + application.
#
# Client secret is read from the AUTHENTIK_VAULT_CLIENT_SECRET env var
# (set by TF in the authentik-secrets Secret).

apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-vault
  namespace: authentik
data:
  vault.yaml: |
    version: 1
    metadata:
      name: vault-oidc
      labels:
        blueprints.goauthentik.io/description: Vault OIDC provider + application
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: vault-provider
        identifiers:
          name: vault
        attrs:
          name: vault
          client_type: confidential
          client_id: vault
          client_secret: !Env AUTHENTIK_VAULT_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://vault.brakebills.io/ui/vault/auth/oidc/oidc/callback
            - matching_mode: strict
              url: https://vault.brakebills.io/oidc/callback
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
      - model: authentik_core.application
        identifiers:
          slug: vault
        attrs:
          name: Vault
          slug: vault
          provider: !KeyOf vault-provider
          meta_launch_url: https://vault.brakebills.io
