# Authentik SSO/OIDC provider for brakebills-talos.
#
# Secrets (secret_key, PostgreSQL password) are generated by Terraform
# and stored as Kubernetes Secrets. The chart references them via
# existingSecret — no passwords in git.

authentik:
  # Use the TF-generated secret for the secret key + postgres password.
  existingSecret:
    secretName: authentik-secrets
  postgresql:
    host: authentik-postgresql
    name: authentik
    user: authentik
  error_reporting:
    enabled: false

# Bundled PostgreSQL (Bitnami subchart).
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: library/postgres
    tag: "17-bookworm"
  auth:
    username: authentik
    database: authentik
    existingSecret: authentik-postgresql
    secretKeys:
      userPasswordKey: password
      adminPasswordKey: postgres-password
  primary:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 8Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

# Bundled Redis (Bitnami subchart).
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 2Gi
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }

server:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }
  ingress:
    enabled: true
    ingressClassName: cilium
    hosts:
      - auth.brakebills.io
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: authentik-tls
        hosts:
          - auth.brakebills.io
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production

worker:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }
  # Mount blueprint ConfigMaps at /blueprints/custom/ so the worker
  # discovers + applies them on startup. The ConfigMaps are created
  # by the authentik-blueprints Argo CD Application.
  volumes:
    - name: blueprints-argocd
      configMap:
        name: authentik-blueprints-argocd
        optional: true
    - name: blueprints-vault
      configMap:
        name: authentik-blueprints-vault
        optional: true
  volumeMounts:
    - name: blueprints-argocd
      mountPath: /blueprints/custom/argocd
      readOnly: true
    - name: blueprints-vault
      mountPath: /blueprints/custom/vault
      readOnly: true
