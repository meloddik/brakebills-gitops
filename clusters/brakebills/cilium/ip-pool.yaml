# IP pool for LoadBalancer Services. Cilium assigns IPs from this range
# and announces them via L2 (ARP) on the LAN.
# Using a small range on the same subnet as the nodes.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default
spec:
  blocks:
    - cidr: 192.168.5.200/28
