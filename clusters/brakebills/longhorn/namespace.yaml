# Longhorn needs privileged PodSecurity — storage drivers require
# hostPath volumes and privileged containers to access raw disks.
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
