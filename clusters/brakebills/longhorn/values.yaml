# Longhorn distributed block storage for brakebills-talos.
#
# 4x RPi5 with NVMe. Talos provisions a 200GB UserVolume (persistent-data)
# on each node via the NVMe disk. Longhorn uses the default data path
# (/var/lib/longhorn) which Talos maps to the ephemeral partition.

# Longhorn requires privileged containers + hostPath volumes. The
# longhorn-system namespace must have PodSecurity set to privileged.
namespaceOverride: longhorn-system

# Default replicas — 2 gives redundancy without saturating all 4 nodes.
# For a 4-node cluster, 3 replicas means every volume is on 3/4 nodes
# which leaves little room for rebuild. 2 is the sweet spot.
defaultSettings:
  defaultReplicaCount: "2"

  # Talos mounts the UserVolume "persistent-data" at /var/mnt/persistent-data.
  # This is a dedicated ~945GB NVMe partition on each node, separate from
  # the 50GiB EPHEMERAL partition. Much better than the default /var/lib/longhorn
  # which would land on EPHEMERAL and fill up fast.
  defaultDataPath: /var/mnt/persistent-data

  # Allow scheduling on control plane nodes (all 3 CPs run workloads).
  allowNodeDrainWithLastHealthyReplica: true

  # Disable automatic upgrades — we control versions via Argo CD.
  autoSalvage: true

# Resource requests for Pi 5 (8GB each).
longhornManager:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

longhornDriver:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

longhornUI:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }

# Ingress for the Longhorn UI.
ingress:
  enabled: true
  ingressClassName: cilium
  host: longhorn.brakebills.io
  tls: true
  tlsSecret: longhorn-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
